edition: 1.0.0
name: tree-hda-cat
access: default
vars:
  region: "cn-hangzhou"
resources:
  streamlit_app:
    component: fc3
    props:
      region: ${vars.region}
      functionName: "tree-hda-cat"
      description: "Tree HDA Cat Streamlit Agent"
      runtime: "python3.10"
      code: ./
      memorySize: 1024
      timeout: 120
      environmentVariables:
        ZHIPU_API_KEY: "填入你的智谱APIKey"
        ZHIPU_BASE_URL: "https://open.bigmodel.cn/api/paas/v4/"
      triggers:
        - triggerName: "httpTrigger"
          triggerType: "http"
          triggerConfig:
            authType: "anonymous"
            methods: ["GET", "POST"]
