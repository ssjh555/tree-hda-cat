edition: 3.0.0
name: tree-hda-cat
access: default

vars:
  region: "cn-hangzhou"

resources:
  streamlit_app:
    component: fc3
    props:
      region: ${vars.region}
      functionName: "tree-hda-cat"
      description: "Tree HDA Cat Streamlit Agent"
      # 关键修改：使用自定义运行时
      runtime: "custom"
      code: ./
      memorySize: 1024
      timeout: 120
      
      # 关键新增：告诉平台如何启动你的应用
      customRuntimeConfig:
        command:
          - streamlit
        args:
          - run
          - app.py
          - --server.port=9000
          - --server.address=0.0.0.0
          - --server.headless=true
        port: 9000

      # ⚠️ 安全警告：由于你的仓库是公开的，这里千万不要写真实的 API Key！
      # 建议先删掉这两个环境变量，或者填假值。真实的 Key 部署后在阿里云后台配置。
      environmentVariables:
        ZHIPU_BASE_URL: "https://open.bigmodel.cn/api/paas/v4/"
        
      triggers:
        - triggerName: "httpTrigger"
          triggerType: "http"
          triggerConfig:
            authType: "anonymous"
            methods: ["GET", "POST"]
